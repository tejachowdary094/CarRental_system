
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveX | Booking Receipt</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .receipt {
            max-width: 700px;
            margin: 30px auto;
            background: #171717;
            border: 1px solid #d6ad60;
            padding: 35px;
            border-radius: 6px;
        }

        .receipt-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            border-bottom: 1px solid #444;
            padding-bottom: 20px;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 13px 0;
            border-bottom: 1px solid #333;
        }

        .receipt-row span:first-child {
            color: #aaa;
        }

        .receipt-total {
            color: #d6ad60;
            font-size: 22px;
            font-weight: bold;
        }

        .receipt-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px auto;
            flex-wrap: wrap;
        }

        @media print {
            body {
                background: white;
                color: black;
            }

            .navbar, .receipt-actions, .footer {
                display: none !important;
            }

            .receipt {
                color: black;
                background: white;
                border: 1px solid #999;
                max-width: 100%;
            }

            .receipt-row span:first-child,
            .receipt p {
                color: #333;
            }

            .receipt-total, .receipt span {
                color: #9b7024;
            }
        }
    </style>
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">DRIVE<span>X</span></a>
    <a href="dashboard.html" class="outline-btn">Dashboard</a>
</header>

<section class="section">
    <div class="receipt" id="receipt">
        <div class="receipt-header">
            <div>
                <h2>DRIVE<span>X</span></h2>
                <p class="muted">Premium Car Rental</p>
            </div>
            <div style="text-align:right">
                <p class="eyebrow">BOOKING RECEIPT</p>
                <strong id="receiptDate"></strong>
            </div>
        </div>

        <div id="receiptDetails" style="margin-top:25px">
            Loading booking information...
        </div>

        <p class="muted" style="margin-top:25px">
            This document confirms a frontend demo booking only.
            It is not proof of an actual vehicle reservation or payment.
        </p>
    </div>

    <div class="receipt-actions">
        <button class="gold-btn" onclick="window.print()">Print / Save PDF</button>
        <a href="index.html" class="outline-btn">Back to Home</a>
    </div>
</section>

<script>
const params = new URLSearchParams(window.location.search);
const bookingId = params.get("id");

const bookings = JSON.parse(localStorage.getItem("drivexBookings") || "[]");

const booking = bookingId
    ? bookings.find(item => item.id === bookingId)
    : bookings[0];

document.getElementById("receiptDate").textContent =
    new Date().toLocaleDateString("en-IN");

const details = document.getElementById("receiptDetails");

if (!booking) {
    details.innerHTML = `
        <h3>Booking not found</h3>
        <p class="muted">Create a demo booking from the homepage first.</p>
    `;
} else {
    const safe = value => String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    })[char]);

    details.innerHTML = `
        <h3 style="color:#d6ad60;margin-bottom:15px">
            Booking Successfully Created
        </h3>

        <div class="receipt-row">
            <span>Booking ID</span>
            <strong>${safe(booking.id)}</strong>
        </div>

        <div class="receipt-row">
            <span>Customer Name</span>
            <strong>${safe(booking.customer)}</strong>
        </div>

        <div class="receipt-row">
            <span>Email</span>
            <strong>${safe(booking.email)}</strong>
        </div>

        <div class="receipt-row">
            <span>Vehicle</span>
            <strong>${safe(booking.carName)}</strong>
        </div>

        <div class="receipt-row">
            <span>Pickup Date</span>
            <strong>${safe(booking.pickup)}</strong>
        </div>

        <div class="receipt-row">
            <span>Return Date</span>
            <strong>${safe(booking.drop)}</strong>
        </div>

        <div class="receipt-row">
            <span>Rental Duration</span>
            <strong>${Number(booking.days)} Days</strong>
        </div>

        <div class="receipt-row">
            <span>Booking Status</span>
            <strong>${safe(booking.status)}</strong>
        </div>

        <div class="receipt-row" style="border:none;margin-top:15px">
            <span>Total Estimated Amount</span>
            <span class="receipt-total">
                ₹${Number(booking.total).toLocaleString("en-IN")}
            </span>
        </div>
    `;
}
</script>

</body>
</html>
