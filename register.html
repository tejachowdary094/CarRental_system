
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveX | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">DRIVE<span>X</span></a>
    <a href="index.html" class="outline-btn">Back Home</a>
</header>

<section class="section">
    <div class="modal-content" style="margin:auto">
        <p class="eyebrow">JOIN DRIVEX</p>
        <h2>Create Your <span>Account</span></h2>
        <p class="muted">Register to manage your rental bookings.</p>

        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" required placeholder="Enter full name">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="regEmail" required placeholder="Enter email">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="regPhone" required pattern="[0-9]{10}" maxlength="10" placeholder="10 digit mobile number">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" required minlength="6" placeholder="Minimum 6 characters">
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" required placeholder="Re-enter password">
            </div>

            <button class="gold-btn full-btn" type="submit">Create Account</button>
        </form>

        <p class="muted" style="text-align:center;margin-top:20px">
            Already registered?
            <a href="login.html" style="color:#d6ad60">Login here</a>
        </p>
    </div>
</section>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.getElementById("regName").value.trim();
    const email = document.getElementById("regEmail").value.trim().toLowerCase();
    const phone = document.getElementById("regPhone").value.trim();
    const password = document.getElementById("regPassword").value;
    const confirm = document.getElementById("confirmPassword").value;

    if (password !== confirm) {
        alert("Passwords do not match!");
        return;
    }

    let users = JSON.parse(localStorage.getItem("drivexUsers") || "[]");

    if (users.some(user => user.email === email)) {
        alert("This email is already registered.");
        return;
    }

    // Frontend demonstration only.
    // Never store real passwords in LocalStorage.
    users.push({name, email, phone});

    localStorage.setItem("drivexUsers", JSON.stringify(users));

    alert("Registration successful! Please login.");

    window.location.href = "login.html";
});
</script>

</body>
</html>
